[project]
name = "model-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jere Robles", email = "jere.robles@meetiqm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit==1.50.0",
]

[project.scripts]
model-inference = "model_inference:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
